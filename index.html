<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Should I Watch?</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header>
      <h1>What Should I Watch?</h1>
      <p>Discover your next favorite show</p>
    </header>

    <main>
      <form id="recommendation-form">
        <div>
          <label for="mood-select">Mood:</label>
          <select id="mood-select" name="mood">
            <option value="Any mood">Any mood</option>
            <option value="lighthearted">Lighthearted</option>
            <option value="comfort">Comfort</option>
            <option value="funny">Funny</option>
            <option value="wholesome">Wholesome</option>
            <option value="thoughtful">Thoughtful</option>
            <option value="thrilling">Thrilling</option>
            <option value="mind-bending">Mind-bending</option>
            <option value="adventurous">Adventurous</option>
            <option value="intense">Intense</option>
            <option value="emotional">Emotional</option>
            <option value="focused">Focused</option>
            <option value="spooky">Spooky</option>
            <option value="slow-burn">Slow-burn</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <div>
          <label for="genre-select">Genre:</label>
          <select id="genre-select" name="genre">
            <option value="Any genre">Any genre</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi & Fantasy">Sci-Fi & Fantasy</option>
            <option value="Action & Adventure">Action & Adventure</option>
            <option value="Mystery">Mystery</option>
            <option value="Crime">Crime</option>
            <option value="Family">Family</option>
            <option value="Animation">Animation</option>
            <option value="Kids">Kids</option>
          </select>
        </div>

        <button type="submit">Find My Shows</button>
      </form>

      <div id="results"></div>
    </main>

    <footer>
      <p>&copy; 2026</p>
    </footer>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
